# Optional override: docker compose -f compose.yaml -f compose.bot-api.yaml up -d
# The bot is deployed from WatchWeaver-DiscordBot. This file enables only WW's API.
services:
  watchweaver:
    environment:
      WATCHWEAVER_LISTEN_ADDR: 172.30.81.2:8080
      WATCHWEAVER_BOT_LISTEN_ADDR: 172.30.82.2:8081
      WATCHWEAVER_BOT_TOKEN_FILE: /run/secrets/ww_bot_token
      WATCHWEAVER_BOT_USER_IDS: ${WATCHWEAVER_BOT_USER_IDS:?Set authorized Discord user IDs}
      WATCHWEAVER_PUBLIC_URL: ${WATCHWEAVER_PUBLIC_URL:?Set the browser-accessible WW origin}
      WATCHWEAVER_BOT_NOTIFICATIONS: ${WATCHWEAVER_BOT_NOTIFICATIONS:-false}
    networks:
      default:
        ipv4_address: 172.30.81.2
      bot_api:
        ipv4_address: 172.30.82.2
    secrets:
      - ww_bot_token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://172.30.81.2:8080/readyz"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.81.0/24
  bot_api:
    name: watchweaver-bot-api
    internal: true
    ipam:
      config:
        - subnet: 172.30.82.0/24
secrets:
  ww_bot_token:
    file: ${WATCHWEAVER_BOT_TOKEN_SOURCE:?Set the host path of the service token file}
