name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN: "64.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize module graph
        run: go mod tidy
      - name: Go vet
        run: go vet ./...
      - name: Privacy and artifact check
        run: scripts/check-release-privacy.sh
      - name: Go test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Race detection for non-SQLite packages
        run: go test -race ./internal/config ./internal/server
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Enforce coverage floor
        run: |
          total_coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Total coverage: ${total_coverage}%"
          awk -v total="$total_coverage" -v min="$COVERAGE_MIN" 'BEGIN {
            if (total + 0 < min + 0) {
              printf("Coverage %.1f%% is below required floor %.1f%%\\n", total, min)
              exit 1
            }
            printf("Coverage %.1f%% meets required floor %.1f%%\\n", total, min)
          }'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
