name: Release image

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch origin main develop
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              git merge-base --is-ancestor "$GITHUB_SHA" origin/develop
            else
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            fi
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test backend
        run: go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web app
        working-directory: web
        run: npm run test
      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck
      - name: Lint web app
        working-directory: web
        run: npm run lint
      - name: Build web app
        working-directory: web
        run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/thef4tdaddy/watchweaver
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          base_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${base_version}-beta.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
      - name: Smoke-test published amd64 image
        run: scripts/smoke-published-image.sh "ghcr.io/thef4tdaddy/watchweaver@${{ steps.build.outputs.digest }}" "${{ steps.version.outputs.value }}" linux/amd64 ghcr.io/thef4tdaddy/watchweaver:0.1.0-beta.31
      - name: Smoke-test published arm64 image
        run: scripts/smoke-published-image.sh "ghcr.io/thef4tdaddy/watchweaver@${{ steps.build.outputs.digest }}" "${{ steps.version.outputs.value }}" linux/arm64
      - name: Record tested artifact
        shell: bash
        run: |
          {
            echo "## Published image verification"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Verified: health, readiness, SPA fallback, version metadata, API write, persistent restart, upgrade from \`0.1.0-beta.31\`, preserved encrypted configuration, backup pair, graceful shutdown"
          } >> "${GITHUB_STEP_SUMMARY}"
