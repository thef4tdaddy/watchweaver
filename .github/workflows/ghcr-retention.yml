name: GHCR beta retention

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without removing images
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-beta-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the five newest beta images
        uses: actions/github-script@v7
        env:
          KEEP_BETAS: "5"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = context.repo.repo;
            const keepBetas = Number(process.env.KEEP_BETAS);
            const dryRun = process.env.DRY_RUN === "true";
            const betaTag = /^\d+\.\d+\.\d+-beta\.\d+$/;
            const shaTag = /^sha-[0-9a-f]+$/;

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                username: owner,
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              },
            );

            const records = versions.map((version) => ({
              id: version.id,
              createdAt: version.created_at,
              tags: version.metadata?.container?.tags ?? [],
            }));
            const currentBetas = records.filter(
              (record) => record.tags.includes("beta") && record.tags.some((tag) => betaTag.test(tag)),
            );
            const oldBetas = records
              .filter((record) => {
                if (record.tags.includes("beta") || record.tags.includes("latest")) return false;
                if (!record.tags.some((tag) => betaTag.test(tag))) return false;
                return record.tags.every((tag) => betaTag.test(tag) || shaTag.test(tag));
              })
              .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));

            const oldBetasToKeep = Math.max(0, keepBetas - currentBetas.length);
            const deletions = oldBetas.slice(oldBetasToKeep);
            await core.summary
              .addHeading("GHCR beta retention")
              .addRaw(`Mode: ${dryRun ? "preview" : "delete"}\n`)
              .addRaw(`Current beta versions: ${currentBetas.length}\n`)
              .addRaw(`Older beta versions: ${oldBetas.length}\n`)
              .addRaw(`Versions selected: ${deletions.length}\n`)
              .write();

            for (const version of deletions) {
              core.info(`${dryRun ? "Would delete" : "Deleting"} version ${version.id}: ${version.tags.join(", ")}`);
              if (!dryRun) {
                await github.rest.packages.deletePackageVersionForUser({
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: version.id,
                });
              }
            }
