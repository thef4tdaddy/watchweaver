codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "64...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 5%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "cmd/watchweaver"
