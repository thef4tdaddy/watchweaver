services:
  watchweaver:
    image: ghcr.io/thef4tdaddy/watchweaver:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      WATCHWEAVER_LISTEN_ADDR: :8080
      WATCHWEAVER_DATABASE: /data/watchweaver.db
    ports:
      - "${WATCHWEAVER_PORT:-8080}:8080"
    volumes:
      - watchweaver-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s

volumes:
  watchweaver-data:
